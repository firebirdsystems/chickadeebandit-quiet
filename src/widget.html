<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Time Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: #fff;
      color: #111827;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .header-icon { font-size: 14px; }
    .header-title { font-size: 12px; font-weight: 600; color: #374151; flex: 1; }
    .header-link { font-size: 11px; color: #6366f1; text-decoration: none; }
    .header-link:hover { text-decoration: underline; }

    .content { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

    .no-session {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #9ca3af;
    }
    .no-session .icon { font-size: 1.8rem; }
    .no-session p { font-size: 12px; text-align: center; }

    .session-summary { display: flex; flex-direction: column; gap: 8px; }
    .session-meta { font-size: 11px; color: #6b7280; }

    .winner-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0fdf4;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .winner-medal { font-size: 1.2rem; }
    .winner-info { flex: 1; }
    .winner-name { font-weight: 600; font-size: 13px; }
    .winner-score { font-size: 11px; color: #059669; }

    .runner-up-list { display: flex; flex-direction: column; gap: 4px; }
    .runner-up-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 12px;
    }
    .runner-up-row:last-child { border-bottom: none; }
    .runner-rank { width: 20px; text-align: center; font-size: 11px; color: #9ca3af; }
    .runner-name { flex: 1; }
    .runner-score { color: #6b7280; font-size: 11px; }

    .member-avatar {
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="header">
  <span class="header-icon">🤫</span>
  <span class="header-title">Quiet Time</span>
  <a class="header-link" href="/run/quiet-time">Open</a>
</div>

<div class="content" id="content">
  <div class="no-session">
    <span class="icon">🤫</span>
    <p>No sessions yet</p>
  </div>
</div>

<script type="module">
import { esc, memberColor, initial } from "/hub-sdk.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  return res.json();
}

async function init() {
  let members = [];
  if (CONTEXT) {
    try {
      const res = await fetch(`${CONTEXT}?keys=family.members`);
      members = ((await res.json())["family.members"]) ?? [];
    } catch {}
  }

  const { rows: [session] } = await db(
    `SELECT * FROM qt_sessions WHERE status = 'completed' ORDER BY ended_at DESC LIMIT 1`
  );
  if (!session) return;

  const { rows: readings } = await db(
    `SELECT member_id, AVG(avg_db) as avg_db, SUM(loud_events) as loud_events
     FROM qt_readings WHERE session_id = ?
     GROUP BY member_id`,
    [session.id]
  );
  if (!readings.length) return;

  readings.sort((a, b) => a.avg_db - b.avg_db);

  const durationMin = Math.round(session.duration_sec / 60);
  const dateStr = new Date(session.ended_at).toLocaleDateString(undefined, { month: "short", day: "numeric" });

  const medals = ["🥇", "🥈", "🥉"];
  const [winner, ...rest] = readings;
  const winnerMember = members.find(m => m.id === winner.member_id);

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="session-summary">
      <div class="session-meta">${dateStr} · ${durationMin} min session</div>
      <div class="winner-row">
        <span class="winner-medal">🥇</span>
        <span class="member-avatar" style="background:${winnerMember ? memberColor(winner.member_id, members) : "#9ca3af"}">
          ${winnerMember ? esc(initial(winnerMember.name)) : "?"}
        </span>
        <div class="winner-info">
          <div class="winner-name">${winnerMember ? esc(winnerMember.name) : "Unknown"}</div>
          <div class="winner-score">${winner.avg_db.toFixed(1)} dB avg · ${winner.loud_events} loud events</div>
        </div>
      </div>
      ${rest.length ? `<div class="runner-up-list">
        ${rest.slice(0, 3).map((r, i) => {
          const m = members.find(mm => mm.id === r.member_id);
          return `
            <div class="runner-up-row">
              <span class="runner-rank">${medals[i + 1] ?? (i + 2)}</span>
              <span class="member-avatar" style="background:${m ? memberColor(r.member_id, members) : "#9ca3af"}; width:18px; height:18px; font-size:9px">
                ${m ? esc(initial(m.name)) : "?"}
              </span>
              <span class="runner-name">${m ? esc(m.name) : "Unknown"}</span>
              <span class="runner-score">${r.avg_db.toFixed(1)} dB</span>
            </div>
          `;
        }).join("")}
      </div>` : ""}
    </div>
  `;
}

init();
</script>
</body>
</html>
